[package]
name = "overtheclass"
version = "0.1.0"
edition = "2024"
description = "班级结业典礼程序：弹出多个 System Error 后播放再见文山视频"

# windows-rs 只在编译 Windows 目标时引入
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
